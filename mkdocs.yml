site_name: GrokifyQL
site_description: SaaS-safe query language and AST policy toolkit for analytics
site_url: https://grokify.github.io/grokifyql/
repo_url: https://github.com/grokify/grokifyql
repo_name: grokify/grokifyql

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Query Language: query-language.md
  - Request Pipeline: request-pipeline.md
  - Schema Validation: schema-validation.md
  - Policy: policy.md
  - Security Hardening: security-hardening.md
  - Authorization: authorization.md
  - Backend Execution: backend-execution.md
  - Integrations: integrations.md
  - Releases:
      - v0.1.0: releases/v0.1.0.md
  - Development: development.md
  - API Reference: https://pkg.go.dev/github.com/grokify/grokifyql
